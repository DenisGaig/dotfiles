# vim:fileencoding=utf-8:foldmethod=marker
term xterm-kitty

## The default is ctrl+shift
# kitty_mod cmd+option

# Usability
confirm_os_window_close 0
window_padding_width 0 4 4 4

## Fix issue with ssh & backspace
# term xterm-256color

## Allow remote control nécessaire pour les sessions kitty
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

## Editor
editor kitty

## Documentation (floating window)
# https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/
map kitty_mod+a>d launch --type=background kitten quick-access-terminal

# === Raccourcis pour mes sessions ===
map ctrl+a>d goto_session ~/.dotfiles/kitty/sessions/dotfiles.kitty-session
map ctrl+a>h goto_session ~/.dotfiles/kitty/sessions/home.kitty-session
map ctrl+a>b goto_session ~/.dotfiles/kitty/sessions/brain.kitty-session
map ctrl+a>n goto_session ~/.dotfiles/kitty/sessions/daily.kitty-session
map ctrl+a>j goto_session ~/.dotfiles/kitty/sessions/journal.kitty-session
map ctrl+a>r goto_session ~/.dotfiles/kitty/sessions/rofimark.kitty-session
map ctrl+a>i goto_session ~/.dotfiles/kitty/sessions/imgtools.kitty-session
map ctrl+a>l goto_session ~/.dotfiles/kitty/sessions/cours.kitty-session
map ctrl+a>c goto_session ~/.dotfiles/kitty/sessions/c.kitty-session
map ctrl+a>t goto_session ~/.dotfiles/kitty/sessions/typst.kitty-session

# Lancement du script menu des sessions kitty
map ctrl+a>s launch --type=overlay bash -c "~/.dotfiles/kitty/scripts/ks.sh"

# Bonus : raccourci pour sélectionner graphiquement parmi tes sessions connues
# map ctrl+a>s goto_session

# === Keymaps ===
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+c copy_or_interrupt
map ctrl+alt+c copy_to_clipboard
#map ctrl+shift+v paste_from_clipboard
map ctrl+v paste_from_clipboard
map ctrl+enter launch --cwd=current

#map ctrl+right next_window # plus nécessaire depuis kitten pass_keys
#map ctrl+left next_window

# Files exploration
map kitty_mod+k kitten choose-files .

# === FENETRES ===
# Ouvre de nouvelles fenêtres verticale et horizontale
# A activer si layout est désactivé.
#map kitty_mod+s combine : launch --location=hsplit --cwd=current : goto_layout splits
#map kitty_mod+v combine : launch --location=vsplit --cwd=current : goto_layout splits
map kitty_mod+q close_window

# Tall layout: disposition des fenêtres (gauche verticale et droite horizontale)
enabled_layouts tall:bias=65;full_size=1;mirrored=false

# Navigation seamless nvim <-> kitty (knubie/vim-kitty-navigator)
map ctrl+j kitten pass_keys.py bottom ctrl+j
map ctrl+k kitten pass_keys.py top    ctrl+k
map ctrl+h kitten pass_keys.py left   ctrl+h
map ctrl+l kitten pass_keys.py right  ctrl+l

# Redimensionne les fenêtres
map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+k resize_window taller
map ctrl+alt+j resize_window shorter 3

# === Tabs ===
tab_bar_min_tabs            1
tab_bar_align               left
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         round

# tab_title_template          "{tab.active_wd.rsplit('/', 1)[-1]}"
tab_title_template "{('[🔐SSH] ' + title.replace('[', '').replace(']', '').split()[0] + fmt.bg.tab + fmt.fg.tab) if tab.active_exe == 'ssh' else tab.active_wd.rsplit('/', 1)[-1]}"

tab_bar_margin_height 0.0 2.0
# window_padding_width 0

# Tab bar
active_tab_foreground   #282a36
active_tab_background   #ff79c6
inactive_tab_foreground #f8f8f2
inactive_tab_background #6272a4
# tab_bar_background      #1e1e2f

# Permet de ne voir que les onglets de la session active
tab_bar_filter session:~ or session:^$

# === Appearance ===
font_family FiraCode Nerd Font
italic_font VictorMonoNF-Italic
font_size 10
background_opacity 0.85
url_color #8be9fd

# Make kitty borderless
# "yes" disables round corners and hides the title bar
# "titlebar-only" leaves round corners but hides title bar
hide_window_decorations titlebar_only

# === Animate cursor ===
cursor_trail 3
cursor_trail_decay 0.1 0.4
custom_shaders cursor-trail-blaze
#custom_shaders cursor-trail-lightning

## OS Window titlebar colors
wayland_titlebar_color system
#macos_titlebar_color system

# Scrollback qui ouvre nvim avec l'historique de la session kitty
# Super utile pour retrouver les résultats de mes recherches et les erreurs éventuelles
#map ctrl+shift+h show_scrollback
#scrollback_pager nvim -u NONE -R -M -c 'lua require("denis.kitty_scrollback")(INPUT_LINE_NUMBER, CURSOR_LINE, CURSOR_COLUMN)' -

# Color theme.
include theme.conf
